<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Invoice | KingDizza Multimedia"><style>
:root{--r:#d71920;--line:#e5e5e5;--muted:#666}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font:15px Arial,sans-serif}header{background:#090909;color:white;padding:17px 4%;display:flex;justify-content:space-between;flex-wrap:wrap}header a{color:white;text-decoration:none}.wrap{width:min(1100px,94%);margin:25px auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.paper,.side{background:white;border:1px solid var(--line);border-radius:8px;padding:23px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:17px;margin-top:18px}.btn{background:var(--r);color:white;border:0;border-radius:5px;padding:11px 15px;font-weight:bold;cursor:pointer}.dark{background:#111}.light{background:#fff;color:#111;border:1px solid #ccc}.muted{color:var(--muted)}.topline{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.logo{font-size:22px;font-weight:900}.logo small{display:block;color:var(--r);font-size:11px;letter-spacing:2px}.tag{font-size:28px;font-weight:900;color:var(--r)}.field{margin:10px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font:inherit}.field textarea{min-height:60px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.label{font-weight:bold;color:#777;font-size:12px;text-transform:uppercase;margin:12px 0}.items{width:100%;border-collapse:collapse}.items td,.items th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left}.items th{font-size:12px;color:#666}.items input{width:100%;min-width:0;padding:8px;border:1px solid #ccc;border-radius:4px}.items .qty{width:55px}.items .price{width:90px}.bottom{display:grid;grid-template-columns:1fr 240px;gap:20px;margin-top:20px}.totals div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.totals .grand{font-size:19px;font-weight:bold;border:0}.side .btn{width:100%;margin:5px 0}.status{min-height:22px;margin:12px 0;color:#555}.notice{background:#fff7e6;border-left:4px solid #d99a00;padding:12px;font-size:13px;line-height:1.5}.saved button{display:block;width:100%;text-align:left;padding:9px;margin:6px 0;border:1px solid #ddd;background:#fafafa;cursor:pointer}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.paper,.side{padding:14px}.items th,.items td{font-size:12px;padding:5px 2px}.items .qty{width:45px}.items .price{width:70px}}@media print{body{background:white}.no-print,header,.side,.heading{display:none!important}.wrap{width:100%;margin:0}.layout{display:block}.paper{border:0;padding:0}.paper input,.paper textarea{border:0;padding:2px}.remove{display:none}@page{size:A4;margin:14mm}}
</style></head><body><header><b>KINGDIZZA MULTIMEDIA</b><nav><a href="index.html">Website</a>　|　<a href="admin.html">Admin dashboard</a></nav></header>
<main class="wrap"><div class="heading no-print"><div><h1>Cloud Invoice Generator</h1><p class="muted">Create invoices and save them to your secure cloud account.</p></div><div><button class="btn light" id="fresh">New invoice</button> <button class="btn dark" id="print">Print / Save PDF</button></div></div>
<div class="layout"><section class="paper"><div class="topline"><div><div class="logo">KINGDIZZA MULTIMEDIA<small>CREATIVE. DIGITAL. RELIABLE.</small></div><p class="muted">055 466 4040 / 054 915 5602<br>kingdizzamultimedia@gmail.com</p><div class="field"><label>Business address</label><input id="businessAddress"></div></div><div style="min-width:180px"><div class="tag">INVOICE</div><div class="field"><label>Invoice number</label><input id="invoiceNo"></div><div class="field"><label>Issue date</label><input id="issueDate" type="date"></div><div class="field"><label>Due date</label><input id="dueDate" type="date"></div></div></div>
<div class="grid"><div><div class="label">Bill to</div><div class="field"><label>Customer / Company *</label><input id="customer" placeholder="Customer full name"></div><div class="field"><label>Customer phone</label><input id="customerPhone"></div><div class="field"><label>Email / address</label><textarea id="customerInfo"></textarea></div></div><div><div class="label">Invoice details</div><div class="field"><label>Reference / project</label><input id="reference"></div><div class="field"><label>Currency</label><select id="currency"><option value="GHS">GHS (GH₵)</option><option value="USD">USD ($)</option><option value="GBP">GBP (£)</option><option value="NGN">NGN (₦)</option></select></div><div class="field"><label>Prepared by</label><input id="preparedBy" value="KingDizza Multimedia"></div></div></div>
<div class="label">Services / items</div><table class="items"><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th class="hide-mobile">Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table><button class="btn light no-print" id="add">＋ Add item</button>
<div class="bottom"><div><div class="field"><label>Notes / payment instructions</label><textarea id="notes" placeholder="Thank you for your business."></textarea></div><div class="field"><label>Terms & conditions</label><textarea id="terms"></textarea></div></div><div class="totals"><div><span>Subtotal</span><b id="subtotal">GH₵0.00</b></div><div><label>Discount % <input id="discount" type="number" min="0" max="100" value="0" style="width:65px"></label></div><div><label>Tax % <input id="tax" type="number" min="0" max="100" value="0" style="width:65px"></label></div><div><span>Discount amount</span><b id="discAmt">GH₵0.00</b></div><div><span>Tax amount</span><b id="taxAmt">GH₵0.00</b></div><div class="grand"><span>Total due</span><b id="total">GH₵0.00</b></div></div></div><p class="muted" style="text-align:center">Thank you for choosing KingDizza Multimedia.</p></section>
<aside class="side no-print"><h3>Invoice tools</h3><p class="muted">Signed in: <b id="user">checking…</b></p><button class="btn" id="save">Save invoice to cloud</button><button class="btn dark" id="load">Load cloud invoices</button><button class="btn light" id="share">Share invoice summary</button><p id="status" class="status" role="status"></p><div class="notice">Invoices are saved in your cloud account and can be accessed on your other signed-in devices. Payment amounts must be updated only after you verify receipt independently.</div><div id="saved" class="saved"></div><button class="btn light" id="logout">Sign out</button></aside></div></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/+esm';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./supabase-config.js';const sb=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=x=>document.getElementById(x);let user,row=0;
const today=()=>new Date().toISOString().slice(0,10),no=()=>{let d=new Date();return'KD-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase()},sym=()=>({GHS:'GH₵',USD:'$',GBP:'£',NGN:'₦'}[$('currency').value]||'GH₵'),fmt=n=>sym()+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function add(desc='',qty=1,price=0){let tr=document.createElement('tr');const cell=(cl,v,ph,type='text')=>{let i=document.createElement('input');i.className=cl;i.value=v;i.placeholder=ph;i.type=type;return i};let a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td'),d=document.createElement('td'),e=document.createElement('td');a.append(cell('desc',desc,'Service or item'));b.append(cell('qty',qty,'Qty','number'));c.append(cell('price',price,'Price','number'));d.className='amount';let rm=document.createElement('button');rm.className='remove';rm.type='button';rm.textContent='×';e.append(rm);tr.append(a,b,c,d,e);$('rows').append(tr);tr.querySelectorAll('input').forEach(i=>i.oninput=calc);rm.onclick=()=>{tr.remove();calc()};row++;calc()}
function calc(){let s=0;document.querySelectorAll('#rows tr').forEach(tr=>{let v=Math.max(0,+tr.querySelector('.qty').value||0)*Math.max(0,+tr.querySelector('.price').value||0);s+=v;tr.querySelector('.amount').textContent=fmt(v)});let d=s*Math.min(100,Math.max(0,+$('discount').value||0))/100,t=(s-d)*Math.min(100,Math.max(0,+$('tax').value||0))/100;$('subtotal').textContent=fmt(s);$('discAmt').textContent=fmt(d);$('taxAmt').textContent=fmt(t);$('total').textContent=fmt(s-d+t)}
function collect(){let d={};['businessAddress','invoiceNo','issueDate','dueDate','customer','customerPhone','customerInfo','reference','currency','preparedBy','notes','terms','discount','tax'].forEach(k=>d[k]=$(k).value);d.items=[...document.querySelectorAll('#rows tr')].map(tr=>({description:tr.querySelector('.desc').value,qty:+tr.querySelector('.qty').value||0,price:+tr.querySelector('.price').value||0}));return d}
function fill(d){['businessAddress','invoiceNo','issueDate','dueDate','customer','customerPhone','customerInfo','reference','currency','preparedBy','notes','terms','discount','tax'].forEach(k=>{if(d[k]!==undefined)$(k).value=d[k]??''});$('rows').replaceChildren();(d.items||[]).forEach(x=>add(x.description,x.qty,x.price));calc()}
function fresh(){fill({invoiceNo:no(),issueDate:today(),dueDate:today(),currency:'GHS',preparedBy:'KingDizza Multimedia',discount:0,tax:0,items:[{description:'',qty:1,price:0}]})}
function say(t){$('status').textContent=t}
let{data:{session}}=await sb.auth.getSession();user=session?.user;if(!user)location.href='admin.html?next=invoice.html';else $('user').textContent=user.email||'Administrator';
$('add').onclick=()=>add();$('currency').onchange=calc;$('discount').oninput=calc;$('tax').oninput=calc;$('print').onclick=()=>window.print();$('fresh').onclick=()=>{if(confirm('Start a new invoice? Unsaved changes will be cleared.'))fresh()};
$('save').onclick=async()=>{let d=collect();if(!d.customer.trim())return say('Enter customer name first.');let{error}=await sb.from('invoices').upsert({...d,owner_id:user.id,amount_paid:0,payment_status:'Unpaid'},{onConflict:'owner_id,invoice_no'});say(error?'Save failed: '+error.message:'Invoice saved securely to cloud.')};
$('load').onclick=async()=>{let{data,error}=await sb.from('invoices').select('*').order('updated_at',{ascending:false}).limit(100);if(error)return say(error.message);$('saved').replaceChildren();let h=document.createElement('h4');h.textContent='Cloud invoices';$('saved').append(h);if(!data.length){$('saved').append('No saved invoices yet.')}data.forEach(d=>{let b=document.createElement('button');b.textContent=d.invoice_no+' · '+d.customer;b.onclick=()=>{fill(d);say('Loaded '+d.invoice_no)};$('saved').append(b)});say(data.length+' invoice(s) loaded.')};
$('share').onclick=()=>{let d=collect(),s='KingDizza Multimedia Invoice '+d.invoiceNo+'\nCustomer: '+d.customer+'\nTotal due: '+$('total').textContent;if(navigator.share)navigator.share({title:'KingDizza Invoice',text:s}).catch(()=>{});else navigator.clipboard?.writeText(s).then(()=>say('Summary copied.'))};
$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};fresh();
</script></body></html>
